name: Cargo Test (desktop)

# Rust 单元测试门禁：在 ubuntu 上编译并跑 src-tauri 的全部 cargo 测试。
# 设计要点（fail 真红）：
#   - `cargo test` 任意用例失败 → 非零退出 → 本作业变红（不吞错、不跳过）。
#   - 安全关键测试（更新签名验签 / --sandbox-soft 持久化防御 / 插件签名）均在其中，
#     回归基线要求 cargo test 全绿 ≥ 300（当前 ~309，见 §4 报告）。
# 注意：src-tauri 是 Tauri 二进制 crate，编译期需下列系统库；windows 专有的 FFI
# （注册表 / Startup lnk 扫描）已用 #[cfg(windows)] 隔离，ubuntu 走 not(windows) 分支，
# 安全测试逻辑平台无关，可在 Linux runner 上完整验证。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cargo-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test (src-tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies (Tauri 2 + xcap + arboard)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            patchelf \
            build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Run cargo test
        run: |
          cd apps/desktop/src-tauri
          cargo test --verbose
