# =============================================================================
# 灵坊桌面端 · 更新包 minisign 签名与上报（P1-8 三件套之「签名」环节）
# -----------------------------------------------------------------------------
# 用途：在发布流水线产出安装包后，用团队私钥对其做 minisign 签名，并把 .sig 全文
#       上报给后端 POST /api/admin/release-signature，由后端写入 ReleaseAsset.signature，
#       供桌面壳（update.rs 的 verify_update_signature，编译期内嵌 UPDATER_PUBKEY）
#       在下载时强制验签（fail-closed）。
#
# 触发：默认 workflow_dispatch（手动、经评审的发布动作），不随 push 自动跑——
#       私钥属于高敏感 secret，签名动作应可审计、不可逆。
#
# 密钥关系（务必一致）：
#   - 本流程用 CI Secret MINISIGN_KEY（minisign 私钥全文）签名；
#   - 其对应公钥的 base64 公钥行（去 untrusted comment）必须编译期内嵌到
#     apps/desktop/src-tauri/src/update.rs 的 UPDATER_PUBKEY，二者不匹配则桌面拒绝更新。
#   - 轮换：生成新 keypair → 改 UPDATER_PUBKEY + 更新 MINISIGN_KEY → 重新编译桌面壳。
#   详见 docs/ci-secrets.md。
# =============================================================================
name: Desktop Updater Signing

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 1.2.3)'
        required: true
      platform:
        description: 'Target platform, one of WINDOWS / DARWIN / LINUX'
        required: true
        default: WINDOWS
      arch:
        description: 'Target arch, one of X86_64 / AARCH64 / UNIVERSAL'
        required: true
        default: X86_64
      artifact-path:
        description: 'Path to the built installer (relative to workspace root)'
        required: true

# 最小权限：仅读源码；签名/上报所需凭据全部来自 encrypted secrets，不经 GITHUB_TOKEN 写库。
permissions:
  contents: read

jobs:
  sign:
    name: Sign installer with minisign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # minisign 静态二进制：下载后必须校验 SHA-256（防供应链投毒），绝不盲装。
      # MINISIGN_SHA256 在仓库 Settings → Secrets/Variables 中维护；升级 minisign 时同步更新。
      - name: Install minisign (sha256-pinned)
        env:
          MINISIGN_SHA256: ${{ vars.MINISIGN_SHA256 }}
        run: |
          set -euo pipefail
          URL="https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz"
          curl -fsSL "$URL" -o minisign.tar.gz
          if [ -z "${MINISIGN_SHA256:-}" ]; then
            echo "::error::vars.MINISIGN_SHA256 未配置，拒绝盲装 minisign（fail-closed）"
            exit 1
          fi
          ACTUAL=$(sha256sum minisign.tar.gz | cut -d' ' -f1)
          if [ "$ACTUAL" != "$MINISIGN_SHA256" ]; then
            echo "::error::minisign 校验和不符（期望 $MINISIGN_SHA256，实际 $ACTUAL），疑似被篡改"
            exit 1
          fi
          tar xzf minisign.tar.gz
          chmod +x minisign-0.11-linux/minisign
          ./minisign-0.11-linux/minisign --version

      - name: Restore signing key from secret
        run: |
          set -euo pipefail
          printf '%s\n' "${{ secrets.MINISIGN_KEY }}" > minisign.key
          chmod 600 minisign.key

      - name: Sign installer
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          SIG="${{ github.workspace }}/${{ inputs.artifact-path }}.sig"
          ./minisign-0.11-linux/minisign -S \
            -s minisign.key \
            -p "$MINISIGN_PASSWORD" \
            -m "${{ github.workspace }}/${{ inputs.artifact-path }}" \
            -x "$SIG" \
            -t "lingfang-updater ${{ inputs.version }} (${{ inputs.platform }}-${{ inputs.arch }})"
          echo "--- .sig 全文（需整体存入后端 signature 字段，含 untrusted comment 行）---"
          cat "$SIG"

      - name: Report signature to backend
        env:
          BACKEND_API: ${{ secrets.BACKEND_API }}
          BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
        run: |
          set -euo pipefail
          SIG="${{ github.workspace }}/${{ inputs.artifact-path }}.sig"
          # 后端 POST /api/admin/release-signature 已存在：要求 platform.release.manage
          # 权限（BACKEND_TOKEN 须为平台管理员令牌）。上报失败（非 2xx）直接退出非零。
          SIG_JSON=$(jq -Rs . < "$SIG")
          curl -fsSL -X POST "$BACKEND_API/api/admin/release-signature" \
            -H "Authorization: Bearer $BACKEND_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${{ inputs.version }}\",\"platform\":\"${{ inputs.platform }}\",\"arch\":\"${{ inputs.arch }}\",\"signature\":${SIG_JSON}}"
