services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lingfang
      POSTGRES_PASSWORD: lingfang
      POSTGRES_DB: lingfang_collab
    ports:
      - "5434:5432"
    volumes:
      - collab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingfang -d lingfang_collab"]
      interval: 3s
      timeout: 3s
      retries: 20

  collab-api:
    build:
      context: .
      dockerfile: apps/collab-api/Dockerfile
    env_file:
      - path: .env.collab.example
        required: true
      - path: .env.collab
        required: false
    environment:
      DATABASE_URL: postgresql://lingfang:lingfang@postgres:5432/lingfang_collab?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm -C apps/collab-api prisma:generate && pnpm -C apps/collab-api prisma migrate deploy && pnpm -C apps/collab-api seed:admin && pnpm -C apps/collab-api start"

  collab-admin:
    build:
      context: .
      dockerfile: apps/collab-admin/Dockerfile
      args:
        VITE_COLLAB_API_BASE: ${VITE_API_BASE_URL:-${VITE_COLLAB_API_BASE:-http://localhost:3000}}
    ports:
      - "4174:4174"
    depends_on:
      - collab-api

volumes:
  collab_pgdata: