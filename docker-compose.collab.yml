services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lingfang
      POSTGRES_PASSWORD: lingfang
      POSTGRES_DB: lingfang_collab
    # 仅绑定宿主机本地回环，不直接暴露公网
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - collab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingfang -d lingfang_collab"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  collab-api:
    build:
      context: .
      dockerfile: apps/collab-api/Dockerfile
    env_file:
      - .env.collab
    environment:
      DATABASE_URL: postgresql://lingfang:lingfang@postgres:5432/lingfang_collab?schema=public
      PORT: 3000
      NODE_ENV: production
    # 仅绑定宿主机本地回环，由 Nginx 反代对外服务
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "cd /app/apps/collab-api && pnpm prisma:generate && pnpm prisma:deploy && node dist/seed-admin.js && node dist/main.js"
    restart: unless-stopped

  collab-admin:
    build:
      context: .
      dockerfile: apps/collab-admin/Dockerfile
      args:
        # 同源部署使用相对路径（空值），前端请求走 /api/ 由 Nginx 代理
        VITE_COLLAB_API_BASE: ${VITE_API_BASE_URL:-${VITE_COLLAB_API_BASE:-}}
        # 国内 CDN 静态资源前缀（如 https://cdn.example.cn/lingfang-admin/），为空则使用同源静态资源
        VITE_CDN_BASE_URL: ${VITE_CDN_BASE_URL:-}
    # 仅绑定宿主机本地回环，由 Nginx 反代对外服务
    ports:
      - "127.0.0.1:4174:4174"
    depends_on:
      - collab-api
    restart: unless-stopped

volumes:
  collab_pgdata:
