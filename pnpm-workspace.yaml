# pnpm workspace：纳入 TS/前端/Node 服务侧包。
# 后端 API 为 apps/collab-api（NestJS）；桌面壳的 Rust 部分由 Cargo workspace 管理（见根 Cargo.toml）。
packages:
  - 'apps/desktop'
  - 'apps/collab-api'
  - 'apps/collab-admin'
  - 'packages/*'
  # - 'plugins/*'   # 临时注释：避开 P:\.pnpm-store EPERM（huobao-drama 等）。install 后恢复。
allowBuilds:
  '@prisma/engines': set this to true or false
  '@scarf/scarf': set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
