<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件浏览器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 12px; color: #333; }
    .path { font-size: 14px; color: #666; margin-bottom: 20px; font-family: monospace; }
    .file-list { border: 1px solid #e0e0e0; border-radius: 4px; }
    .file-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .file-item:last-child { border-bottom: none; }
    .file-item:hover { background: #f9fafb; }
    .icon { font-size: 18px; }
    .name { flex: 1; font-size: 14px; color: #333; }
    .size { font-size: 12px; color: #999; }
    .error { color: #ef4444; padding: 12px; background: #fee; border-radius: 4px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 文件浏览器</h1>
    <div class="path" id="currentPath">加载中...</div>
    <div class="file-list" id="fileList"></div>
    <div id="error"></div>
  </div>
  <script>
    let currentPath = '';

    async function loadDir(path) {
      try {
        document.getElementById('error').innerHTML = '';
        const result = await window.LingFangBridge?.invokeCapability('fs.read', { path });
        if (!result || !result.entries) {
          throw new Error('无权限或路径不存在');
        }
        currentPath = path;
        document.getElementById('currentPath').textContent = `当前路径: ${path}`;
        const list = document.getElementById('fileList');
        list.innerHTML = result.entries.map(e => `
          <div class="file-item" onclick="openItem('${e.path}', ${e.isDirectory})">
            <span class="icon">${e.isDirectory ? '📁' : '📄'}</span>
            <span class="name">${e.name}</span>
            <span class="size">${e.isDirectory ? '' : formatSize(e.size)}</span>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('error').innerHTML = `<div class="error">❌ ${err.message}</div>`;
      }
    }

    function openItem(path, isDir) {
      if (isDir) {
        loadDir(path);
      } else {
        alert(`文件: ${path}\n（预览功能待实现）`);
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // 初始加载 Documents
    if (window.LingFangBridge) {
      loadDir('$HOME/Documents');
    } else {
      document.getElementById('error').innerHTML = '<div class="error">❌ LingFangBridge 未就绪（需在 LingFang 桌面环境中运行）</div>';
    }
  </script>
</body>
</html>
