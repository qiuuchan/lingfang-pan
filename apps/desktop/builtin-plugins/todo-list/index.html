<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 20px; color: #333; }
    .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1d4ed8; }
    .todo-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #f0f0f0; }
    .todo-item:last-child { border-bottom: none; }
    .todo-item.done .text { text-decoration: line-through; color: #999; }
    .checkbox { width: 18px; height: 18px; cursor: pointer; }
    .text { flex: 1; font-size: 14px; color: #333; }
    .delete { color: #ef4444; cursor: pointer; font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 待办清单</h1>
    <div class="input-group">
      <input id="newTodo" type="text" placeholder="输入新的待办事项..." />
      <button onclick="addTodo()">添加</button>
    </div>
    <div id="todoList"></div>
  </div>
  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function render() {
      const list = document.getElementById('todoList');
      list.innerHTML = todos.map((todo, i) => `
        <div class="todo-item ${todo.done ? 'done' : ''}">
          <input type="checkbox" class="checkbox" ${todo.done ? 'checked' : ''} onchange="toggle(${i})">
          <span class="text">${todo.text}</span>
          <span class="delete" onclick="del(${i})">×</span>
        </div>
      `).join('');
    }

    function addTodo() {
      const input = document.getElementById('newTodo');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      localStorage.setItem('todos', JSON.stringify(todos));
      input.value = '';
      render();
    }

    function toggle(i) {
      todos[i].done = !todos[i].done;
      localStorage.setItem('todos', JSON.stringify(todos));
      render();
    }

    function del(i) {
      todos.splice(i, 1);
      localStorage.setItem('todos', JSON.stringify(todos));
      render();
    }

    document.getElementById('newTodo').addEventListener('keypress', e => {
      if (e.key === 'Enter') addTodo();
    });

    render();
  </script>
</body>
</html>
