[package]
name = "lingfang-desktop"
version = "0.0.21"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
dirs = "5"
# 自制更新器（design §5）：check_update 调后端 /api/releases/latest 解析 JSON 判断有无更新，
# download_update 下载安装包 + 流式 SHA-256 校验 + 调起安装目录的 updater.exe 覆盖重启。
# 摆脱 tauri-plugin-updater 与 minisign 签名密钥（PRD R1/R6）。
sha2 = "0.10"
# fetch_models 命令（llm_fetch.rs）直连 LLM provider 的 /v1/models 拉取模型列表。
# features=json 解析 OpenAI 兼容响应体；features=rustls-tls 复用 rustls 避免原生 OpenSSL/WinHTTP 依赖；
# default-features=false 裁掉默认的 native-tls / charset / blocking 等不需要的 feature，减小产物体积。
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
# Task 14 插件签名校验：minisign 非对称验签（与 updater 同款，已传递依赖、直接声明复用已编译产物）。
# verify_plugin_signature 用 PublicKey::from_base64 + verify 校验插件 manifest.sig。
minisign-verify = "0.2"
# 本地草稿插件：生成创建/更新时间戳（RFC 3339 格式）。
chrono = "0.4"
# 插件能力：clipboard（剪贴板读写，纯 Rust 跨平台，无 Tauri 依赖）。
arboard = "3"
# 插件能力：system.screenshot（跨平台截屏，支持 Linux/macOS/Windows）。
xcap = "0.9"
# 插件能力：system.screenshot 截图 PNG → base64 data URL 编码。
base64 = "0.22"
# 运行时按需下载（task 07-03 step 2）：portable Python/Node 解压、版本号比较、SHA256 已由 sha2 覆盖。
# zip 解压 Node 官方 zip；flate2+tar 解压 python-build-standalone 的 .tar.gz（install_only）。
zip = "2"
flate2 = "1"
tar = "0.4"
semver = "1"
