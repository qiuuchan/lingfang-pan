[package]
name = "lingfang-desktop"
version = "0.0.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
dirs = "5"
# Tauri 自动更新插件（design §4.1）：检查更新 → 下载 → minisign 验签 → 安装。
# endpoints 不写死在 tauri.conf.json（后端地址用户动态配置），由 updater.rs 运行时
# app.updater_builder().endpoints() 注入；pubkey 内嵌 conf.json 验签。
tauri-plugin-updater = "2"
# url crate：tauri-plugin-updater 2.x 的 endpoints() 强制要求 Vec<Url>（非 String），
# check_update 命令用 format! 拼出 URL 字符串后需 Url::parse 转换（design §4.5 预见的必要依赖）。
url = "2"
# fetch_models 命令（llm_fetch.rs）直连 LLM provider 的 /v1/models 拉取模型列表。
# features=json 解析 OpenAI 兼容响应体；features=rustls-tls 复用 rustls 避免原生 OpenSSL/WinHTTP 依赖；
# default-features=false 裁掉默认的 native-tls / charset / blocking 等不需要的 feature，减小产物体积。
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
