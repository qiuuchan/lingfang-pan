server {
  listen 19005;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 安全响应头（审计 H2）：防点击劫持、收敛 XSS 面、禁 MIME 嗅探、HSTS。
  # CSP：管理端为同源 SPA，script-src 仅放行自身与极验动态脚本；
  # style-src 含 'unsafe-inline' 以兼容 React 内联 style 属性（不影响脚本 XSS 防护）。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.geetest.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://collab-api:19006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
