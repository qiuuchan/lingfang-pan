# Cargo workspace：Tauri 桌面壳的 Rust 部分 + 自制 Windows 安装/更新/卸载器。
# 后端 API 由 apps/collab-api（NestJS）提供，不再使用 Rust 后端（见 docs/collab-platform.md）。
[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/desktop/installer",
]

# release 优化：减体积 + 提升启动速度。
# - lto="fat" + codegen-units=1：跨 crate 全程序内联优化（编译变慢，但产物更小更快）。
# - strip="symbols"：剥除调试符号（与日志行号无关，panic 仍保留位置信息）。
# - panic="abort"：去掉 unwind 表，进一步减体积（桌面 GUI 不依赖 panic unwind 做清理）。
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
